<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>4ndr0guard Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span id="status" class="status enabled">GUARD ACTIVE</span>
    <label class="switch">
      <input type="checkbox" id="toggle-btn" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="row">
    <input type="text" id="domain-input" placeholder="Target domain to whitelist...">
    <button id="add-whitelist">INJECT</button>
  </div>
  
  <div class="row log-controls">
    <button id="toggle-log">EXTRACT TELEMETRY</button>
  </div>
  
  <div id="log-panel" style="display: none;">
    <ul id="log-list">
      </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
