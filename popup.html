<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4NDR0666 ServiceGuard</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-panel main-popup">
    <!-- Header -->
    <div class="hud-header">
      <div class="glyph-container">
        <!-- Injected from 4ndr0666_glyph.txt -->
        <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--accent-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="glyph-ring-1" d="M 64,12 A 52,52 0 1 1 63.9,12 Z" stroke-dasharray="21.78 21.78" stroke-width="2"/>
          <path class="glyph-ring-2" d="M 64,20 A 44,44 0 1 1 63.9,20 Z" stroke-dasharray="10 10" stroke-width="1.5" opacity="0.7"/>
          <path class="glyph-hex" d="M64 30 L91.3 47 L91.3 81 L64 98 L36.7 81 L36.7 47 Z"/>
          <text x="64" y="67" text-anchor="middle" dominant-baseline="middle" fill="var(--accent-cyan)" stroke="none" font-size="56" font-weight="700" font-family="'Cinzel Decorative', serif">Ψ</text>
        </svg>
      </div>
      <div class="header-text">
        <div class="title">4NDR0666</div>
        <div class="subtitle">GHOST PROTOCOL v7.4</div>
      </div>
    </div>

    <!-- Current Site (v7.3.0: one-click authorize/spoof/block — the app-level
         quick-decision surface) -->
    <div class="section site-panel">
      <div class="section-label">CURRENT SITE</div>
      <div class="site-origin glass-subpanel">
        <span id="siteOrigin" class="site-origin-text">—</span>
        <span id="siteBadges" class="site-badges"></span>
      </div>
      <div class="action-row">
        <button class="hud-button" id="siteAuthorize">AUTHORIZE</button>
        <button class="hud-button spoof-btn" id="siteSpoof">SPOOF</button>
        <button class="hud-button destructive" id="siteBlock">BLOCK</button>
      </div>
      <div class="action-row">
        <button class="hud-button small" id="siteReset">ASK AGAIN (REMOVE SITE RULES)</button>
      </div>
    </div>

    <!-- Master Toggle -->
    <div class="section">
      <div class="section-label">GHOST PROTOCOL</div>
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="masterToggle">
          <span class="slider"></span>
        </label>
        <span id="toggleLabel" class="toggle-label">ACTIVE — DEFAULT DENY</span>
      </div>
    </div>

    <!-- Decision Surface (v7.3.0) -->
    <div class="section">
      <div class="section-label">DECISION SURFACE</div>
      <div class="mode-row">
        <button class="hud-button mode-btn on" id="modeInline">INLINE BAR (IN-PAGE)</button>
        <button class="hud-button mode-btn" id="modeWindow">PROMPT WINDOW</button>
      </div>
    </div>

    <!-- Live Blocked Attempts -->
    <div class="section">
      <div class="section-label">CURRENT PAGE — BLOCKED</div>
      <div id="blockedList" class="blocked-list glass-subpanel">
        <!-- Populated dynamically by popup.js -->
        <div class="empty-state">No registration attempts yet</div>
      </div>
      <div class="action-row">
        <button class="hud-button" id="refreshBlocked">REFRESH</button>
        <button class="hud-button" id="allowAllCurrent">ALLOW ALL THIS ORIGIN</button>
      </div>
    </div>

    <!-- Whitelist -->
    <div class="section">
      <div class="section-label">WHITELIST — AUTHORIZE (ONE PER LINE)</div>
      <textarea id="whitelistInput" class="glass-textarea" placeholder="example.com&#10;app.example.com" spellcheck="false"></textarea>
      <div class="action-row">
        <button class="hud-button" id="saveWhitelist">SAVE &amp; APPLY</button>
        <button class="hud-button" id="clearWhitelist">CLEAR</button>
      </div>
    </div>

    <!-- Spooflist (v7.3.0) -->
    <div class="section">
      <div class="section-label spoof-label">SPOOFLIST — AUTO-SPOOF, NEVER ASK (ONE PER LINE)</div>
      <textarea id="spooflistInput" class="glass-textarea spoof-textarea" placeholder="news.example&#10;chat.example.com" spellcheck="false"></textarea>
      <div class="action-row">
        <button class="hud-button spoof-btn" id="saveSpooflist">SAVE &amp; APPLY</button>
        <button class="hud-button spoof-btn" id="clearSpooflist">CLEAR</button>
      </div>
    </div>

    <!-- Blacklist (v7.2.0) -->
    <div class="section">
      <div class="section-label destructive-label">BLACKLIST — HARD DENY (ONE PER LINE)</div>
      <textarea id="blacklistInput" class="glass-textarea destructive-textarea" placeholder="tracker.example&#10;ads.example.com" spellcheck="false"></textarea>
      <div class="action-row">
        <button class="hud-button destructive" id="saveBlacklist">SAVE &amp; APPLY</button>
        <button class="hud-button destructive" id="clearBlacklist">CLEAR</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="status-text" id="statusText">Ready</div>
      <span class="version-chip">v7.4.0</span>
      <button class="hud-button small" id="openTriMode">OPEN IN TRI-MODE</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
