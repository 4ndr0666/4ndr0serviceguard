<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Roboto+Mono:wght@400;700&amp;family=Orbitron:wght@600;900&amp;display=swap');

      .font-brand {
        font-family: 'Cinzel Decorative', 'Cinzel', serif;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .font-display {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      .font-mono {
        font-family: 'Roboto Mono', monospace;
      }
    </style>

    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#091b26"/>
      <stop offset="55%" stop-color="#050a0f"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>

    <radialGradient id="cyberAura" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface & Gradients -->
    <linearGradient id="glassLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#0A131A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#050A0F" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="40%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Neon Glow & Bloom Filters -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Matrix Scanline & Grid Patterns -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#00E5FF" fill-opacity="0.12"/>
    </pattern>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- Canvas Deep Base -->
  <rect width="1200" height="480" fill="url(#bgGlow)"/>
  <rect width="1200" height="480" fill="url(#matrixGrid)"/>
  <rect width="1200" height="480" fill="url(#cyberAura)"/>
  <rect width="1200" height="480" fill="url(#scanlineGrad)" pointer-events="none"/>

  <!-- Tactical Boundary Crosshairs & Border Frames -->
  <g opacity="0.4">
    <line x1="40" y1="36" x2="1160" y2="36" stroke="#00E5FF" stroke-opacity="0.18" stroke-dasharray="8, 6"/>
    <line x1="40" y1="444" x2="1160" y2="444" stroke="#00E5FF" stroke-opacity="0.18" stroke-dasharray="8, 6"/>
    
    <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#subtleGlow)"/>
    <path d="M 1170 60 L 1170 30 L 1140 30" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#subtleGlow)"/>
    <path d="M 30 420 L 30 450 L 60 450" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#subtleGlow)"/>
    <path d="M 1170 420 L 1170 450 L 1140 450" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#subtleGlow)"/>

    <circle cx="30" cy="30" r="2.5" fill="#00E5FF"/>
    <circle cx="1170" cy="30" r="2.5" fill="#00E5FF"/>
    <circle cx="30" cy="450" r="2.5" fill="#00E5FF"/>
    <circle cx="1170" cy="450" r="2.5" fill="#00E5FF"/>
  </g>

  <!-- 3lectric Glass Panel Enclosure -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="1080" height="368" rx="16" fill="#050A0F" fill-opacity="0.65"/>
    <rect x="0" y="0" width="1080" height="368" rx="16" 
          fill="url(#glassLinear)" 
          stroke="url(#glassStroke)" 
          stroke-width="1.6"/>

    <!-- Corner Structural Clips -->
    <path d="M 0 28 L 0 16 C 0 7.16 7.16 0 16 0 L 36 0" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
    <path d="M 1044 0 L 1064 0 C 1072.84 0 1080 7.16 1080 16 L 1080 36" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
    <path d="M 0 340 L 0 352 C 0 360.84 7.16 368 16 368 L 36 368" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
    <path d="M 1044 368 L 1064 368 C 1072.84 368 1080 360.84 1080 352 L 1080 340" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
  </g>

  <!-- LEFT: HUD Calibration Dial with Crosshairs, Telemetry Text & SplashScreenGlyph -->
  <g transform="translate(210, 240)">
    <!-- Ambient Radial Glow -->
    <circle cx="0" cy="0" r="125" fill="#00E5FF" fill-opacity="0.04" filter="url(#neonGlow)"/>

    <!-- Outer Tech Calibration Reticle & Rings -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#00E5FF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3, 9"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="140, 25, 45, 25"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#67E8F9" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Tactical Cardinal Crosshairs -->
    <g stroke="#00E5FF" stroke-width="1.8" opacity="0.75" filter="url(#subtleGlow)">
      <!-- Top Crosshair -->
      <line x1="0" y1="-122" x2="0" y2="-94"/>
      <circle cx="0" cy="-122" r="1.5" fill="#00E5FF"/>
      
      <!-- Bottom Crosshair -->
      <line x1="0" y1="94" x2="0" y2="122"/>
      <circle cx="0" cy="122" r="1.5" fill="#00E5FF"/>
      
      <!-- Left Crosshair -->
      <line x1="-122" y1="0" x2="-94" y2="0"/>
      <circle cx="-122" cy="0" r="1.5" fill="#00E5FF"/>
      
      <!-- Right Crosshair -->
      <line x1="94" y1="0" x2="122" y2="0"/>
      <circle cx="122" cy="0" r="1.5" fill="#00E5FF"/>

      <!-- Diagonal Corner Reticle Tics -->
      <line x1="-76" y1="-76" x2="-68" y2="-68" stroke-width="1.2" opacity="0.6"/>
      <line x1="76" y1="-76" x2="68" y2="-68" stroke-width="1.2" opacity="0.6"/>
      <line x1="-76" y1="76" x2="-68" y2="68" stroke-width="1.2" opacity="0.6"/>
      <line x1="76" y1="76" x2="68" y2="68" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Surrounding HUD Telemetry & Status Text -->
    <!-- Top-Right Callout: GHOST_V7.1 -->
    <g transform="translate(18, -96)">
      <line x1="0" y1="0" x2="16" y2="-12" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="16" y1="-12" x2="80" y2="-12" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
      <text x="20" y="-16" class="font-mono" font-size="8.5" fill="#00E5FF" font-weight="bold" letter-spacing="1">GHOST_V7.1</text>
    </g>

    <!-- Bottom-Left Callout: NULL:DEFAULT_DENY -->
    <g transform="translate(-18, 96)">
      <line x1="0" y1="0" x2="-16" y2="12" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="-16" y1="12" x2="-102" y2="12" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
      <text x="-98" y="8" class="font-mono" font-size="8.5" fill="#8892B0" letter-spacing="1">
        NULL:<tspan fill="#67E8F9">DEFAULT_DENY</tspan>
      </text>
    </g>

    <!-- Top-Left Telemetry Coordinates -->
    <text x="-106" y="-88" class="font-mono" font-size="7.5" fill="#8892B0" opacity="0.75" letter-spacing="1">TGT://SW_GATE</text>

    <!-- Bottom-Right Mode Telemetry -->
    <text x="32" y="92" class="font-mono" font-size="7.5" fill="#8892B0" opacity="0.75" letter-spacing="1">POL:[ENFORCE]</text>

    <!-- Integrated 4ndr0666 SplashScreenGlyph Component Geometry centered at (0, 0) -->
    <g transform="translate(-128, -128) scale(2)">
      <!-- Outer Dashed Orbit Ring[cite: 6] -->
      <path d="M 64,12 A 52,52 0 1 1 63.9,12 Z" 
            fill="none" 
            stroke="#00E5FF" 
            stroke-width="2" 
            stroke-dasharray="21.78 21.78" 
            filter="url(#subtleGlow)"/>

      <!-- Secondary Orbit Ring[cite: 6] -->
      <path d="M 64,20 A 44,44 0 1 1 63.9,20 Z" 
            fill="none" 
            stroke="#67E8F9" 
            stroke-width="1.5" 
            stroke-dasharray="10 10" 
            opacity="0.7"/>

      <!-- Precision Hexagon Container[cite: 6] -->
      <path d="M64 30 L91.3 47 L91.3 81 L64 98 L36.7 81 L36.7 47 Z" 
            fill="#0A131A" 
            fill-opacity="0.75" 
            stroke="#00E5FF" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            filter="url(#subtleGlow)"/>

      <!-- Core Psi Glyph in Cinzel Decorative[cite: 6] -->
      <text x="64" y="67" 
            text-anchor="middle" 
            dominant-baseline="middle" 
            fill="#00E5FF" 
            font-size="56" 
            font-weight="700" 
            font-family="'Cinzel Decorative', serif" 
            filter="url(#neonGlow)">Ψ</text>
      <text x="64" y="67" 
            text-anchor="middle" 
            dominant-baseline="middle" 
            fill="#E0FFFF" 
            font-size="56" 
            font-weight="700" 
            font-family="'Cinzel Decorative', serif">Ψ</text>
    </g>
  </g>

  <!-- RIGHT: Typography & Technical Specification -->
  <g transform="translate(390, 134)">
    
    <!-- Top System Breadcrumb / Terminal Header -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-18" width="142" height="22" rx="4" fill="#00E5FF" fill-opacity="0.08" stroke="#00E5FF" stroke-opacity="0.3"/>
      <circle cx="11" cy="-7" r="3.5" fill="#00E5FF" filter="url(#subtleGlow)"/>
      <text x="22" y="-4" class="font-mono" font-size="9.5" fill="#67E8F9" font-weight="bold">SEC_LAYER // MV3</text>

      <text x="156" y="-4" class="font-mono" font-size="9.5" fill="#8892B0" letter-spacing="1">CORE: 
        <tspan fill="#67E8F9">GHOST_PROTOCOL_v7.1.1</tspan>
      </text>
    </g>

    <!-- Main Title: Set in Cinzel Decorative with Neon Glow -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" class="font-brand" font-size="44" font-weight="900" fill="#00E5FF" opacity="0.35" filter="url(#neonGlow)">4ndr0serviceguard</text>
      <text x="0" y="0" class="font-brand" font-size="44" font-weight="900" fill="url(#cyanCore)">4ndr0serviceguard</text>
    </g>

    <!-- Tactical Descriptor Subheading -->
    <g transform="translate(2, 90)">
      <text x="0" y="0" class="font-display" font-size="13" font-weight="600" fill="#8892B0" letter-spacing="2.5">
        TACTICAL SERVICE WORKER INTERCEPTION &amp; PURGE MATRIX
      </text>
    </g>

    <!-- Modular Status Chips (Glass HUD Matrix Blocks) -->
    <g transform="translate(0, 118)">
      <!-- Module 1: Default-Deny -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="42" rx="6" 
              fill="#0A131A" fill-opacity="0.75" 
              stroke="#00E5FF" stroke-opacity="0.22"/>
        <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#00E5FF" filter="url(#subtleGlow)"/>
        <text x="14" y="17" class="font-mono" font-size="8" fill="#8892B0">DEFENSE PROTOCOL</text>
        <text x="14" y="32" class="font-mono" font-size="11.5" font-weight="bold" fill="#67E8F9">DEFAULT-DENY</text>
      </g>

      <!-- Module 2: Stealth Proxy Engine -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="186" height="42" rx="6" 
              fill="#0A131A" fill-opacity="0.75" 
              stroke="#00E5FF" stroke-opacity="0.22"/>
        <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#00E5FF" filter="url(#subtleGlow)"/>
        <text x="14" y="17" class="font-mono" font-size="8" fill="#8892B0">CORE HOOK ENGINE</text>
        <text x="14" y="32" class="font-mono" font-size="11.5" font-weight="bold" fill="#67E8F9">PROXY CAMOUFLAGE</text>
      </g>

      <!-- Module 3: Dual Persona Targeting -->
      <g transform="translate(382, 0)">
        <rect x="0" y="0" width="270" height="42" rx="6" 
              fill="#0A131A" fill-opacity="0.75" 
              stroke="#00E5FF" stroke-opacity="0.22"/>
        <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#67E8F9" filter="url(#subtleGlow)"/>
        <text x="14" y="17" class="font-mono" font-size="8" fill="#8892B0">TARGET PROFILES</text>
        <text x="14" y="32" class="font-mono" font-size="11.5" font-weight="bold" fill="#E0FFFF">SEC-OPS &amp; PRIVACY GUARDS</text>
      </g>
    </g>

    <!-- Bottom Technical Specs Telemetry String -->
    <g transform="translate(2, 196)">
      <line x1="0" y1="-12" x2="652" y2="-12" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="1"/>
      
      <text x="0" y="6" class="font-mono" font-size="9" fill="#8892B0">
        [PURGE-ON-LOAD: <tspan fill="#67E8F9">ACTIVE</tspan>]
      </text>
      <text x="150" y="6" class="font-mono" font-size="9" fill="#8892B0">
        [CACHE_STORAGE: <tspan fill="#67E8F9">PURGED</tspan>]
      </text>
      <text x="310" y="6" class="font-mono" font-size="9" fill="#8892B0">
        [WS_FIREWALL: <tspan fill="#67E8F9">PHANTOM</tspan>]
      </text>
      <text x="470" y="6" class="font-mono" font-size="9" fill="#8892B0">
        [INJECTION: <tspan fill="#67E8F9">TWO-WORLD</tspan>]
      </text>
    </g>
  </g>

  <!-- Right Cybernetic Barcode / Calibration Ribbon -->
  <g transform="translate(1085, 96)" opacity="0.6">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1"/>
    
    <line x1="-8" y1="20" x2="0" y2="20" stroke="#00E5FF" stroke-width="1"/>
    <line x1="-14" y1="28" x2="0" y2="28" stroke="#00E5FF" stroke-width="2"/>
    <line x1="-6" y1="36" x2="0" y2="36" stroke="#00E5FF" stroke-width="1"/>
    <line x1="-18" y1="44" x2="0" y2="44" stroke="#67E8F9" stroke-width="3"/>
    <line x1="-8" y1="52" x2="0" y2="52" stroke="#00E5FF" stroke-width="1"/>
    <line x1="-12" y1="60" x2="0" y2="60" stroke="#00E5FF" stroke-width="1.5"/>

    <line x1="-8" y1="120" x2="0" y2="120" stroke="#00E5FF" stroke-width="1"/>
    <line x1="-16" y1="128" x2="0" y2="128" stroke="#00E5FF" stroke-width="2.5"/>
    <line x1="-6" y1="136" x2="0" y2="136" stroke="#00E5FF" stroke-width="1"/>
    
    <line x1="-14" y1="220" x2="0" y2="220" stroke="#00E5FF" stroke-width="2"/>
    <line x1="-8" y1="228" x2="0" y2="228" stroke="#00E5FF" stroke-width="1"/>
    <line x1="-18" y1="236" x2="0" y2="236" stroke="#67E8F9" stroke-width="2"/>

    <text x="-8" y="270" class="font-mono" font-size="8" fill="#00E5FF" opacity="0.6" transform="rotate(-90 -8,270)" letter-spacing="2">3LECTRIC_GLASS</text>
  </g>
</svg>
